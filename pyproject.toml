[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visioneval"
version = "0.1.0"
description = "A focused evaluation harness for image-classification regressions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "VisionEval Contributors" }]
dependencies = [
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "rich>=13,<14",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
visioneval = "visioneval.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.setuptools.packages.find]
include = ["visioneval*"]