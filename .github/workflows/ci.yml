name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Show typer/click versions
        run: python -m pip show typer click || true
      - name: Run tests
        id: pytest
        run: set -o pipefail && python -m pytest -vv --tb=short | tee pytest-output.txt
      - name: Comment pytest failure on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '### CI pytest failure\n\n';
            try {
              const log = fs.readFileSync('pytest-output.txt', 'utf8');
              const tail = log.split('\n').slice(-120).join('\n');
              body += '```\n' + tail + '\n```\n';
            } catch (e) {
              body += '_Could not read pytest-output.txt_\n';
            }
            body += '\n_Posted by CI from `' + context.sha.slice(0,7) + '`_';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
