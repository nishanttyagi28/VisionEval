# Simple TruthGraph-style verify cases for VisionEval (CPU-only, no network).
name: verify-demo-cases
cases:
  - id: supported_square
    model: demo
    response: "A red square appears on a white background."
    caption: "A red square on a white background."
    objects: [square, red square]
    absent_objects: [cat, car]

  - id: contradicted_cat
    model: demo
    response: "There is a cat sitting next to a car."
    caption: "A red square on a white background."
    objects: [square, red square]
    absent_objects: [cat, car]

  - id: insufficient_unrelated
    model: demo
    claim: "Earth has one natural satellite called the Moon."
    evidence:
      - text: "Python is a programming language used for software development."
        source: programming_book
        reliability: 0.9
